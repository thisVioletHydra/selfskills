# Не даём фри-хостингу усыпить бэк (Railway): пинг раз в 10 минут.
# Нюанс GitHub: schedule может опаздывать на пару минут и отключается,
# если в репе нет активности 60 дней (придёт письмо — жмякнуть re-enable).
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GraphQL
        env:
          GRAPHQL_URL: ${{ secrets.VITE_GRAPHQL_URL }}
        run: |
          if [ -z "$GRAPHQL_URL" ]; then
            echo "VITE_GRAPHQL_URL secret is not set" >&2
            exit 1
          fi
          # --max-time 75: если бэк всё же уснул, ждём его cold start
          curl -sS -X POST "$GRAPHQL_URL" \
            -H 'Content-Type: application/json' \
            --data '{"query":"{ __typename }"}' \
            --retry 3 --retry-all-errors --max-time 75 \
            -o /dev/null -w 'status: %{http_code}\n'
