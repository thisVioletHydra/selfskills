# Required GitHub Actions secrets:
#   DATABASE_URL — Railway Postgres public TCP URL (для Actions; без кавычек)
#
# Не коммитить секреты в репозиторий.

name: Seed DB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/api/prisma/seed.ts'
      - 'apps/api/prisma/seed-data/**'
      - 'apps/api/prisma/migrations/**'
      - 'apps/api/prisma/schema.prisma'
      - '.github/workflows/seed-db.yml'

concurrency:
  group: seed-db-main
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api exec prisma generate

      # Migrate до seed — чтобы не ловить race, если схема и контент уехали в одном push
      - run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: pnpm --filter api run prisma:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
