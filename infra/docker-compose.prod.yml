# Lean prod stack for a weak VPS.
# From repo root:
#   cp infra/.env.prod.example infra/.env.prod
#   # edit secrets
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-selfskills}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-selfskills}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Do not publish 5432 to the internet — api talks on the compose network.
    mem_limit: 256m
    cpus: 0.5
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-selfskills}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-selfskills}?schema=public
      PORT: ${API_PORT:-3000}
      NODE_OPTIONS: --max-old-space-size=192
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    mem_limit: 384m
    cpus: 0.75

volumes:
  pgdata:
